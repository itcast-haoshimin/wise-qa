  openai:
    model: qwen3-max
    api-key: ${ALIYUN_API_KEY}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    temperature: 0.8
    timeout: 30
    
  agent:
    checkpointer:
      postgres:
        min: 5 # 最小连接数
        max: 10 # 最大连接数
        url: ${POSTGRES_URL}

redis:
  host: 192.168.150.101
  port: 6379
  password: ${REDIS_PASSWORD}

nacos:
  server-addr: 192.168.150.101:8848 # nacos注册中心
  username: ${NACOS_USERNAME}
  password: ${NACOS_PASSWORD}
  config:
    namespace: public
    group: DEFAULT_GROUP
  discovery:
    name: agent-center
    namespace: f923fb34-cb0a-4c06-8fca-ad61ea61a3f0
    ip: 192.168.150.1

prompt:
  route:
    chat:
      data-id: route-agent-system-message.txt
  recommend:
    chat:
      data-id: recommend-agent-system-message.txt
  buy:
    chat:
      data-id: buy-agent-system-message.txt
  consult:
    chat:
      data-id: consult-agent-system-message.txt
  knowledge:
    chat:
      data-id: knowledge-agent-system-message.txt
  unknown:
    chat:
      data-id: unknown-agent-system-message.txt
  text:
    chat:
      data-id: text-system-chat-message.txt
  a2a:
    chat:
      data-id: a2a-agent-system-message.txt

a2a:
  servers:
    - http://127.0.0.1:3601/
    - http://127.0.0.1:3602/
    - http://127.0.0.1:3603/
    - http://127.0.0.1:3604/
    - http://127.0.0.1:3605/

mcp-servers:
  - name: agent_center_mcp
    transport: streamable_http
    url: http://localhost:18099/mcp