server:
  port: 18089  #服务端口
  host: 0.0.0.0 #监听所有网络接口
  logger:
#    file: logs/app.log
    level: DEBUG # 日志级别: CRITICAL, ERROR, WARNING, INFO, DEBUG

db:
  url: ${DB_URL}
  pool_size: 10           # 连接池大小
  max_overflow: 20        # 超出连接池的最大连接数
  pool_timeout: 30        # 池中无连接时的等待时间
  pool_recycle: 1800      # 连接回收时间（秒）
  echo: True               # 控制台输出 SQL

jwt:
  private_key: ${JWT_PRIVATE_KEY}
  public_key: ${JWT_PUBLIC_KEY}
  expire_hours: 720 #token有效期，单位小时


